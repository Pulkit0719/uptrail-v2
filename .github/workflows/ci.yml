name: CI

on:
  pull_request:
  push:
    branches: [main, migration/manus-independence]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://uptrail:placeholder@127.0.0.1:3306/uptrail
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - name: Verify generated migrations are committed
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle
